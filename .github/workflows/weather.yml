name: weather data
# Data for the Miami high-temperature test (RESEARCH_LOG.md): Kalshi KXHIGHMIA
# markets, candles and trades; forecasts; observed highs. See weather/download.py.
on:
  push:
    branches: [weather-research]
    paths: ["weather/download.py", ".github/workflows/weather.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather
  cancel-in-progress: false
jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python weather/download.py markets
      - uses: actions/upload-artifact@v4
        with:
          name: weather-markets
          path: weather/data/kalshi_markets.parquet
          retention-days: 7
  kalshi:
    needs: markets
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: [candles, trades]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: weather-markets
          path: weather/data
      - run: python weather/download.py ${{ matrix.part }} --minutes 300
      - uses: actions/upload-artifact@v4
        with:
          name: weather-${{ matrix.part }}
          path: weather/data/kalshi_*
          if-no-files-found: ignore
          retention-days: 7
  other:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [forecasts, obs]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python weather/download.py ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        with:
          name: weather-${{ matrix.part }}
          path: |
            weather/data/*
            !weather/data/kalshi_*
          if-no-files-found: ignore
          retention-days: 7
  commit:
    needs: [markets, kalshi, other]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-research
      - uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          path: weather/data
          merge-multiple: true
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f weather/data/*.tmp
          git add -A weather/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Weather research data"
          git pull --rebase origin weather-research
          git push origin HEAD:weather-research
