name: weather research
on:
  push:
    branches: [weather-research]
    paths: ["weather/**", ".github/workflows/weather.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python weather/run.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A weather/out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Weather research data"
          git pull --rebase origin weather-research
          git push origin HEAD:weather-research
