name: incentives
# Which Kalshi NBA markets carry liquidity or volume rewards, checked daily.
on:
  schedule:
    - cron: "10 15 * * *"
  push:
    branches: [main]
    paths: ["live/log_incentives.py", ".github/workflows/incentives.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  incentives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python -m live.log_incentives
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/incentives
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kalshi incentive programs"
          git pull --rebase
          git push
