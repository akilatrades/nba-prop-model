name: kalshi combos
# Kalshi's NBA same-game combo (parlay) markets and a sample of their trades
# (RESEARCH_LOG.md, parlays). The probe (scripts/probe_kalshi_combos.py) ran once.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  combos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python -m research.backfill_combos --minutes 240 --workers 8 --sample 30000
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/kalshi_history/*.tmp
          git add -A data/kalshi_history/combos_*
          du -sh data/kalshi_history/combos_* || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kalshi NBA combo markets and trades"
          git pull --rebase -X theirs
          git push
