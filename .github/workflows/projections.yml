name: projections
# Model probabilities for every open Kalshi NBA prop: after the afternoon
# injury report and again shortly before the first evening tip-offs (UTC).
on:
  schedule:
    - cron: "10 21 * * *"
    - cron: "35 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - run: python run_projections.py
      - name: Commit projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/projections
          git add -A outputs/projections
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Projections"
          git pull --rebase
          git push
