name: projections
# Settles paper positions, prices every open Kalshi NBA prop and adds the
# rule's paper positions. Four runs a day (UTC) so each game is seen at least
# once 2 to 6 hours before tip-off: noon-to-3pm ET weekend games by the
# first two, 7-8pm ET games by the third, late games by the fourth.
on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m live.fetch_nba_data
      - run: python -m live.nba_paper
      - name: Run projections (errors shown as an annotation)
        run: |
          set -o pipefail
          python -m live.nba_projections 2>&1 | tee run.log || {
            echo "::error::$(tail -c 3000 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
      - run: python -m live.summarize
      - name: Commit projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/projections outputs/paper outputs/bets outputs/paper_maker
          git add -A outputs/projections outputs/paper outputs/bets outputs/paper_maker outputs/dashboard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Projections"
          git pull --rebase
          git push
