name: nba trade (dry run)
# Builds the NBA "no" seller's real orders from the latest projections and
# logs them to outputs/live/ WITHOUT sending anything to the exchange
# (live/nba_trade.py with TRADE_MODE=dry and no credentials). This is the
# rehearsal: it shows exactly what would be placed, sized from a $250
# bankroll, with the risk limits applied. Every 15 minutes in NBA hours.
#
# Switching this to live trading is a deliberate, manual step by the account
# owner: add the KALSHI_KEY_ID and KALSHI_PRIVATE_KEY secrets, set the
# TRADE_MODE repository variable to "live" and KALSHI_ENV to "demo" or
# "prod", and pass them into the job's env below.
on:
  schedule:
    - cron: "*/15 15-23 * * *"
    - cron: "*/15 0-4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADE_MODE: dry
      DRY_BANKROLL: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build orders (dry run)
        run: |
          set -o pipefail
          python -m live.nba_trade 2>&1 | tee run.log || {
            echo "::error::$(tail -c 3000 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
          test -f outputs/live/last_run.json && echo "::notice::$(tr '\n' ' ' < outputs/live/last_run.json)" || true
      - run: python -m live.summarize
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/live outputs/dashboard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Dry-run trade log $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
