name: backfill Kalshi history
# Downloads settled 2025-26 Kalshi NBA prop markets and their hourly prices
# around each game, one job per stat. Resumable: each run continues where
# the last stopped, and a run with nothing left to fetch finishes in seconds.
on:
  push:
    branches: [main]
    paths: ["scripts/backfill_kalshi.py", ".github/workflows/backfill.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        series: [KXNBAPTS, KXNBAREB, KXNBAAST, KXNBA3PT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python scripts/backfill_kalshi.py --series ${{ matrix.series }} --minutes 320
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.series }}
          path: data/kalshi_history/*${{ matrix.series }}*
          if-no-files-found: ignore
          retention-days: 7
  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: data/kalshi_history
          merge-multiple: true
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kalshi price history: backfill progress"
          git pull --rebase
          git push
