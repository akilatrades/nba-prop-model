name: nfl trade (dry run)
# The live trader on NFL anytime-touchdown and receiving-yards props
# (TRADE_MARKET=nfl, live/nfl_trade.py), dry run, on game days: Thursday
# night, Sunday and Monday night, US time. Same rule, risk limits and
# manual switch to live as the NBA job. Ledgers in outputs/live/nfl/.
on:
  schedule:
    - cron: "*/15 13-23 * * 0,1,4"
    - cron: "*/15 0-4 * * 1,2,5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADE_MODE: dry
      TRADE_MARKET: nfl
      DRY_BANKROLL: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build orders (dry run)
        run: |
          set -o pipefail
          python -m live.nba_trade 2>&1 | tee run.log || {
            echo "::error::$(tail -c 3000 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
          test -f outputs/live/nfl/last_run.json && echo "::notice::$(tr '\n' ' ' < outputs/live/nfl/last_run.json)" || true
      - run: python -m live.summarize
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/live outputs/dashboard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Dry-run NFL trade log $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
