name: Format forward-validation change
on:
  push:
    branches: [forward-validation-2026-10-17]
    paths:
      - '.github/workflows/forward-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forward-validation-2026-10-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.11.13
      - run: ruff format live/execution.py live/forward_validation.py tests/test_forward_validation.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/execution.py live/forward_validation.py tests/test_forward_validation.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format forward validation files"
          git push origin HEAD:forward-validation-2026-10-17
