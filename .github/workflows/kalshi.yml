name: log Kalshi prices
# Snapshots of Kalshi's NBA player-prop prices: once in the morning, then
# before the evening tip-off windows (times are UTC; most games tip between
# 7:00 and 10:30 pm US Eastern).
on:
  schedule:
    - cron: "40 16 * * *"  # morning lines
    - cron: "40 22 * * *"  # before 7 pm ET tip-offs (6 pm ET in winter)
    - cron: "50 23 * * *"  # before 7-8 pm ET tip-offs
    - cron: "20 1 * * *"   # before 9:30-10:30 pm ET tip-offs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m live.log_kalshi
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/kalshi
          git add -A data/kalshi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kalshi snapshot"
          git pull --rebase
          git push
