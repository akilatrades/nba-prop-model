name: market scan
# Which Kalshi sports markets share the NBA "no" seller's edge (RESEARCH_LOG.md, 2026-10-16).
on:
  push:
    branches: [main]
    paths: ["scripts/scan_markets.py", ".github/workflows/scan.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/scan_markets.py list
      - uses: actions/upload-artifact@v4
        with:
          name: scan-series
          path: outputs/scan/series.json
  scan:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: scan-series
          path: outputs/scan
      - run: python scripts/scan_markets.py scan --shard ${{ matrix.shard }} --shards 6 --minutes 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ matrix.shard }}
          path: |
            outputs/scan/scan_*.json
            outputs/scan/orders_*.csv.gz
          if-no-files-found: ignore
  commit:
    needs: [list, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: outputs/scan
          merge-multiple: true
      - run: python scripts/scan_markets.py report
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/scan
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Market scan results"
          git pull --rebase
          git push
