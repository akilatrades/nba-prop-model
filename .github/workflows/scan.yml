name: series scan
# Which Kalshi sports markets have the one-sided flow (RESEARCH_LOG.md, scan).
on:
  workflow_dispatch:
    inputs:
      series:
        description: "Space-separated series tickers to scan (empty: list only)"
        default: ""
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  list:
    if: ${{ inputs.series == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python scripts/scan_series.py list
      - uses: actions/upload-artifact@v4
        with:
          name: scan-list
          path: data/scan/series.parquet
  prepare:
    if: ${{ inputs.series != '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(echo '${{ inputs.series }}' | tr ' ' '\n' | grep . | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        series: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python scripts/scan_series.py scan --series ${{ matrix.series }} --minutes 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ matrix.series }}
          path: data/scan/${{ matrix.series }}_*
          if-no-files-found: ignore
  commit:
    needs: [list, scan]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: data/scan
          merge-multiple: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/scan/*.tmp
          git add -A data/scan
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Series scan data"
          git pull --rebase
          git push
