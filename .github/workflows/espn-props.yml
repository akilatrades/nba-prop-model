name: ESPN props
# Stored sportsbook prop lines for 2025-26 games, for idea 2 (RESEARCH_LOG.md).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m live.fetch_nba_data
      - run: python -m research.backfill_espn_props
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/espn_props
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ESPN stored prop lines, 2025-26"
          git pull --rebase
          git push
