name: book lines
# Logs the sportsbooks' NBA and NFL prop lines (de-vigged consensus only) to
# outputs/books/ six times a day in NBA hours, 15 minutes before each
# projection run so the paper ledgers and the trader see fresh lines.
# About 8 Odds API credits per game, roughly 15,000 a month.
on:
  schedule:
    - cron: "15 12,15,18,21,23 * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m live.log_books nba
      - run: python -m live.log_books nfl
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/books
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Book lines $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
