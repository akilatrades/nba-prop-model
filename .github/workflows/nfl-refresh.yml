name: nfl refresh
# Daily: NFL data, the week's projections (ladders), and the model-vs-market comparison.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m live.fetch_nfl_data
      - run: python -m live.nfl_projections
      - run: python -m live.nfl_compare
      - run: python -m live.summarize
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/nfl outputs/nfl outputs/dashboard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NFL refresh"
          git pull --rebase -X theirs
          git push
