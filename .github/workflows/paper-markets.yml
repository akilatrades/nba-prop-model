name: paper markets
# Model-free "no" seller paper tests in other Kalshi series (RESEARCH_LOG.md, 2026-10-16).
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run (errors shown as an annotation)
        run: |
          set -o pipefail
          python -m live.paper_markets 2>&1 | tee run.log || {
            echo "::error::$(tail -c 3000 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/paper_markets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Paper markets: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
