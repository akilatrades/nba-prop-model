[project]
name = "sports-market-maker"
version = "0.1.0"
description = "Market making in Kalshi sports markets: resting orders against retail flow, with sport models as filters"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Akila Juan"}]
keywords = ["prediction-markets", "kalshi", "market-making", "player-props", "nba", "nfl", "python"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
